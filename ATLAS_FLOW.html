<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATLAS FLOW — 밸류체인 흐름도</title>
<style>
:root{--bg:#14171A;--bg2:#1B1F23;--line:#2A2F35;--bone:#EBEAE4;--mute:#8A9099;--dim:#5C636B;
--heat:#E0552F;--warm:#D89A3A;--neu:#7A8894;--cold:#4A8DB8;--fro:#566169;--theme:#C9B88A;--focus:#F2E9CF;--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--bone);font-family:"Pretendard","IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;font-size:13px;overflow:hidden}
#app{display:grid;grid-template-rows:52px 1fr 34px;grid-template-columns:1fr 360px;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg2)}
header h1{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.04em;white-space:nowrap}
header h1 span{color:var(--mute);font-weight:400;margin-left:8px;font-size:12px}
header .tabs{display:flex;gap:2px;margin-left:6px}
header .tabs a{color:var(--mute);text-decoration:none;font-size:12px;padding:5px 9px;border-radius:6px;border:1px solid transparent;white-space:nowrap}
header .tabs a:hover{color:var(--bone);border-color:var(--line)}
header .tabs a.cur{color:var(--bone);border-color:var(--theme);background:rgba(201,184,138,.08)}
header .tools{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:nowrap;min-width:0}
input[type=search]{background:#0F1215;border:1px solid var(--line);color:var(--bone);padding:6px 10px;border-radius:6px;font:inherit;width:170px;min-width:90px;flex:0 1 170px;outline:none}
input[type=search]:focus{border-color:var(--theme);box-shadow:0 0 0 2px rgba(201,184,138,.18)}
.chip{border:1px solid var(--line);background:transparent;color:var(--mute);padding:5px 8px;border-radius:999px;font:inherit;font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--mute);color:var(--bone)}
.chip.on{color:var(--bone);border-color:var(--bone)}
.chip.t-HEAT.on{border-color:var(--heat);color:var(--heat)}.chip.t-WARM.on{border-color:var(--warm);color:var(--warm)}
.chip.t-NEUTRAL.on{border-color:var(--neu);color:var(--neu)}.chip.t-COLD.on{border-color:var(--cold);color:var(--cold)}
.sep{width:1px;height:18px;background:var(--line)}
:focus-visible{outline:2px solid var(--theme);outline-offset:2px}
#stage{position:relative;overflow:hidden;background:var(--bg);background-image:radial-gradient(circle at 1px 1px,#1E2327 1px,transparent 0);background-size:28px 28px}
svg#svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#svg.dragging{cursor:grabbing}
.lane-band{fill:#FFFFFF;fill-opacity:.018;pointer-events:none}
.lane-label{font-family:var(--mono);font-size:12px;fill:var(--mute);letter-spacing:.08em;pointer-events:none}
.lane-sub{font-family:var(--mono);font-size:10px;fill:var(--dim);letter-spacing:.04em;pointer-events:none}
.edge{fill:none;stroke:var(--dim);stroke-opacity:.30;stroke-width:1.1;transition:stroke-opacity .2s,stroke-width .2s}
.edge.far{stroke-opacity:.12}
.edge.dash{stroke-dasharray:3 5;stroke-opacity:.13}
.edge.k-THEME_DRIVES{stroke:var(--theme);stroke-opacity:.16}
.edge.k-OPERATES_IN{stroke:var(--dim);stroke-opacity:.5}
.edge.lit1{stroke-opacity:.96;stroke-width:2.1}
.edge.lit2{stroke-opacity:.55;stroke-width:1.4}
.edge.off{stroke-opacity:.04}
.edge.k-SUPPLIES_TO.lit1,.edge.k-SUPPLIES_TO.lit2{stroke:var(--focus)}
.edge.k-THEME_DRIVES.lit1,.edge.k-THEME_DRIVES.lit2{stroke:var(--theme)}
.edge.k-DEMAND_COMOVES.lit1,.edge.k-DEMAND_COMOVES.lit2{stroke:#9FB4C7}
.edge.k-CAPACITY_COMPETES.lit1,.edge.k-CAPACITY_COMPETES.lit2{stroke:#D4B36A}
.edge.k-SUBSTITUTES.lit1,.edge.k-SUBSTITUTES.lit2{stroke:#B48ED8}
.edge.k-INVERSE.lit1,.edge.k-INVERSE.lit2{stroke:var(--heat)}
.edge.k-SUPPLIES_TO.lit1{marker-end:url(#arrow)}
.node{cursor:pointer}
.node circle.core{transition:fill-opacity .2s,stroke-opacity .2s}
.node circle.halo{fill:none;stroke-width:1;stroke-opacity:.22;transition:stroke-opacity .2s}
.node circle.glow{fill:none;stroke-width:6;stroke-opacity:0;filter:url(#blur)}
.node.tier-HEAT circle.glow{stroke-opacity:.35}
.node .lbl{font-size:12px;fill:var(--bone);paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round;font-weight:500}
.node .sub{font-family:var(--mono);font-size:9.5px;fill:var(--mute);paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.node .bal{font-size:9px;fill:var(--mute)}
.node.off circle.core{fill-opacity:.10;stroke-opacity:.12}.node.off circle.glow{stroke-opacity:0}
.node.off .lbl{fill:var(--dim)}.node.off .sub,.node.off .bal{fill:#3E444B}
.node.lit2 circle.core{fill-opacity:.6}
.node.sel circle.halo{stroke-opacity:1;stroke-width:1.8;animation:pulse 1.6s ease-in-out infinite}
.node.hov circle.halo{stroke-opacity:.8}
.node.hit circle.halo{stroke-opacity:.95;stroke:var(--theme);stroke-width:1.6}
.node.theme polygon{transition:fill-opacity .2s}
.node.theme.off polygon{fill-opacity:.10}
.node.theme .lbl{font-size:11.5px;fill:#D9CBA4}
.node.co .lbl{font-size:10.5px;font-weight:400}
@keyframes pulse{0%,100%{r:var(--rr)}50%{r:calc(var(--rr) + 4px)}}
.particle{fill:var(--focus);pointer-events:none}
#root.z-mid .node .sub,#root.z-mid .node .bal{display:none}
#root.z-far .node .sub,#root.z-far .node .bal,#root.z-far .node.co .lbl{display:none}
#root.z-far .node.tier-NEUTRAL .lbl,#root.z-far .node.tier-COLD .lbl{display:none}
#insp{border-left:1px solid var(--line);background:var(--bg2);overflow:auto;padding:16px 18px 32px}
#insp h2{font-size:15px;font-weight:600;margin-bottom:2px}
#insp .meta{font-family:var(--mono);font-size:11px;color:var(--mute);margin-bottom:12px}
#insp .tier{display:inline-block;padding:2px 8px;border-radius:999px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;margin-right:6px;border:1px solid}
#insp h3{font-size:11.5px;color:var(--mute);margin:16px 0 6px;font-weight:500}
#insp p{line-height:1.55;color:#CFCFC8;font-size:12.5px}
#insp .row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:12px}
#insp .row b{font-weight:500;color:var(--bone)}
#insp .row span{color:var(--mute);text-align:right;flex:1}
#insp .lk{color:var(--bone);cursor:pointer;text-decoration:underline dotted var(--dim);text-underline-offset:3px}
#insp .lk:hover{color:var(--theme)}
#insp .co{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px}
#insp .co .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
#insp .co .dot.dd{background:var(--bone)}
#insp .co .cp{color:var(--mute);font-size:11px;margin-left:auto;text-align:right}
#insp .empty{color:var(--mute);line-height:1.65;font-size:12.5px;margin-top:8px}
#insp .empty b{color:var(--bone);font-weight:500}
#insp kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--bone)}
footer{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 16px;border-top:1px solid var(--line);color:var(--mute);font-size:11.5px;font-family:var(--mono)}
footer .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
footer .lg i{display:inline-block;width:9px;height:9px;border-radius:50%}
#hint{color:var(--dim);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--mute);background:var(--bg);z-index:5}
#tip{position:absolute;pointer-events:none;background:#0F1215;border:1px solid var(--line);color:var(--bone);padding:7px 10px;border-radius:6px;font-size:11.5px;max-width:320px;line-height:1.45;opacity:0;transition:opacity .12s;z-index:4;box-shadow:0 6px 20px rgba(0,0,0,.45)}
#tip b{font-weight:600}#tip .m{color:var(--mute);font-family:var(--mono);font-size:10.5px}
#mini{position:absolute;right:14px;bottom:14px;width:220px;height:118px;background:rgba(15,18,21,.92);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;z-index:3}
#mini svg{width:100%;height:100%;display:block}
#mini .vp{fill:rgba(201,184,138,.12);stroke:var(--theme);stroke-width:1.5;vector-effect:non-scaling-stroke}
#zoomctl{position:absolute;left:14px;bottom:14px;display:flex;gap:4px;z-index:3}
#zoomctl button{background:rgba(15,18,21,.92);border:1px solid var(--line);color:var(--mute);width:30px;height:30px;border-radius:6px;font-family:var(--mono);font-size:13px;cursor:pointer}
#zoomctl button:hover{color:var(--bone);border-color:var(--mute)}
#zoomctl .wide{width:auto;padding:0 10px;font-size:11.5px}
@media (max-width:1300px){header .tabs a{padding:5px 6px}header .tools input{width:120px}}
@media (max-width:900px){#app{grid-template-columns:1fr}#insp{display:none}header .tools input{width:130px}#mini{display:none}}
@media (prefers-reduced-motion:reduce){.node.sel circle.halo{animation:none}.edge,.node circle{transition:none}}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>ATLAS FLOW<span id="ver">밸류체인 흐름도</span></h1>
  <nav class="tabs" aria-label="뷰 이동">
    <a href="./ATLAS_CONSOLE.html">콘솔</a><a href="./ATLAS_GRAPH.html">관계망</a><a class="cur" href="./ATLAS_FLOW.html" aria-current="page">흐름</a><a href="./ATLAS_MAP.html">히트맵</a><a href="./ATLAS_GUIDE.html">가이드</a>
  </nav>
  <div class="tools">
    <input id="q" type="search" placeholder="산업·기업·테마 검색  /" aria-label="검색">
    <button class="chip t-HEAT on" data-tier="HEAT">HEAT</button>
    <button class="chip t-WARM on" data-tier="WARM">WARM</button>
    <button class="chip t-NEUTRAL on" data-tier="NEUTRAL">NEUTRAL</button>
    <button class="chip t-COLD on" data-tier="COLD">COLD</button>
    <span class="sep"></span>
    <button class="chip" id="flowOnly" title="공급 흐름만 표시">흐름만</button>
    <button class="chip" id="cross">가로층 접기</button>
    <button class="chip" id="play">전파 재생</button>
    <button class="chip" id="reset">초기화</button>
  </div>
</header>
<div id="stage">
  <div id="load"><div>data/ATLAS_PACK.json 불러오는 중…</div></div>
  <svg id="svg" role="img" aria-label="밸류체인 흐름도">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#F2E9CF"/></marker>
      <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    </defs>
    <g id="root"></g>
  </svg>
  <div id="tip"></div>
  <div id="zoomctl"><button id="zin" title="확대 (+)">+</button><button id="zout" title="축소 (−)">−</button><button id="fit" class="wide" title="전체 보기 (0)">전체</button><button id="one" class="wide" title="실제 크기 (1)">1:1</button></div>
  <div id="mini" title="클릭해서 이동"><svg id="minisvg"></svg></div>
</div>
<aside id="insp"></aside>
<footer>
  <span id="hint">클릭 = 관계 조명 · 더블클릭 = 기업 펼침 · 휠 = 확대 · Shift+휠 = 좌우 이동 · 드래그 = 이동 · Esc = 해제</span>
  <span class="lg"><i style="background:var(--heat)"></i>HEAT</span>
  <span class="lg"><i style="background:var(--warm)"></i>WARM</span>
  <span class="lg"><i style="background:var(--neu)"></i>NEUTRAL</span>
  <span class="lg"><i style="background:var(--cold)"></i>COLD</span>
  <span class="lg"><i style="background:var(--theme);border-radius:1px;transform:rotate(45deg)"></i>테마</span>
  <span class="lg" style="color:var(--dim)">▲부족 ●균형 ▼과잉</span>
  <span id="asof" style="white-space:nowrap"></span>
</footer>
</div>
<script>
// ───────── 층 정의 (수정은 여기서) ─────────
const LAYERS=[
 {id:0,name:"상류",sub:"원자재 · 에너지",ids:["ENE-01","ENE-05","MAT-02","MAT-01","MAT-03","MAT-06","MAT-04"]},
 {id:1,name:"중류",sub:"장비 · 부품 · 시공",ids:["ITC-03","ITC-04","IND-03","IND-04","IND-05","IND-01","IND-02","MAT-05","ENE-03"]},
 {id:2,name:"인프라",sub:"유틸 · 물류 · 데이터센터",ids:["ENE-02","ENE-04","UTL-01","UTL-02","UTL-03","UTL-04","IND-06","IND-07","IND-08","IND-09","COM-01","RLE-02"]},
 {id:3,name:"플랫폼",sub:"반도체 · 소프트웨어 · 미디어 · 제약",ids:["ITC-02","ITC-05","ITC-01","ITC-06","ITC-07","ITC-08","COM-03","COM-02","COM-04","HLT-04","HLT-02","HLT-01"]},
 {id:4,name:"최종 수요",sub:"소비 · 헬스 서비스",ids:["DIS-01","DIS-02","DIS-03","DIS-04","DIS-05","STP-01","STP-02","STP-03","STP-04","HLT-03","HLT-05"]},
];
const CROSS=["FIN-01","FIN-02","FIN-03","RLE-01","RLE-03"];
const TC={HEAT:"#E0552F",WARM:"#D89A3A",NEUTRAL:"#7A8894",COLD:"#4A8DB8",FROZEN:"#566169"};
const BAL={SHORTAGE:"▲",BALANCED:"●",GLUT:"▼"};
const RED=matchMedia("(prefers-reduced-motion: reduce)").matches;
const COLW=400, PADX=170, ROWH=66, TOP=176, THEME_Y=48, CROSS_PAD=110;

let D=null,N=[],E=[],byId={},sel=null,hov=null,expanded=new Set(),flowOnly=false,crossHidden=false,tiers=new Set(Object.keys(TC));
let VW=0,VH=0,WW=0,WH=0,view={x:0,y:0,k:1},dragN=null,panning=null,playing=false,tween=null;
const svg=document.getElementById("svg"),root=document.getElementById("root"),tip=document.getElementById("tip"),stage=document.getElementById("stage");
const NS="http://www.w3.org/2000/svg",el=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
const esc=s=>String(s??"").replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
const txt=v=>v==null?"":typeof v==="string"?v:Array.isArray(v)?v.map(txt).join(" · "):Object.values(v).map(txt).join(" ");

async function boot(){
  try{const r=await fetch("data/ATLAS_PACK.json",{cache:"no-store"});if(!r.ok)throw 0;D=await r.json();init()}
  catch(e){const b=document.getElementById("load");b.innerHTML='<div>같은 폴더의 data/ATLAS_PACK.json을 읽지 못했습니다. 파일을 직접 선택하세요.</div><input type="file" accept=".json">';
    b.querySelector("input").onchange=ev=>{const fr=new FileReader();fr.onload=()=>{D=JSON.parse(fr.result);init()};fr.readAsText(ev.target.files[0])}}
}
function init(){
  document.getElementById("load").remove();
  document.getElementById("ver").textContent=(D.meta.version||"").replace("ATLAS_PACK_","")+" · 밸류체인 흐름도";
  document.getElementById("asof").textContent=D.meta.as_of||"";
  build();layout();render();fitView(false);inspectEmpty();tick();
}
function build(){
  N=[];E=[];byId={};
  const lane={};LAYERS.forEach(L=>L.ids.forEach(id=>lane[id]=L.id));CROSS.forEach(id=>lane[id]="X");
  D.industries.forEach(i=>{const n={id:i.id,kind:"ind",name:i.name,tier:i.tier,lane:lane[i.id]??2,ref:i,r:i.tier==="HEAT"?14:i.tier==="WARM"?11.5:9.5,x:0,y:0};N.push(n);byId[n.id]=n});
  (D.themes||[]).forEach(t=>{const n={id:t.id,kind:"theme",name:t.name,lane:"T",ref:t,r:10,x:0,y:0};N.push(n);byId[n.id]=n});
  D.edges.forEach(e=>{if(byId[e.from]&&byId[e.to])E.push({a:byId[e.from],b:byId[e.to],type:e.type,strength:e.strength,mech:e.mechanism||""})});
  (D.themes||[]).forEach(t=>(t.linked_industries||[]).forEach(id=>{if(byId[id]&&!E.some(e=>e.a.id===t.id&&e.b.id===id))E.push({a:byId[t.id],b:byId[id],type:"THEME_DRIVES",strength:"M",mech:""})}));
  E.forEach(e=>{const la=e.a.lane,lb=e.b.lane;e.far=(typeof la==="number"&&typeof lb==="number"&&Math.abs(la-lb)>=2)});
}
const laneX=l=>PADX+l*COLW;
function layout(){
  WW=PADX*2+COLW*(LAYERS.length-1);
  const maxRows=Math.max(...LAYERS.map(L=>L.ids.length));
  WH=TOP+ROWH*maxRows+CROSS_PAD;
  const th=N.filter(n=>n.kind==="theme");th.forEach((n,i)=>{n.x=PADX-60+(WW-PADX*2+120)*(i+.5)/th.length;n.y=THEME_Y;n.stag=i%2});
  N.filter(n=>n.lane==="X").forEach((n,i,a)=>{n.x=PADX+(WW-PADX*2)*(i+.5)/a.length;n.y=WH-52});
  const ind=N.filter(n=>n.kind==="ind"&&n.lane!=="X");
  ind.forEach(n=>{n.x=laneX(n.lane);n.y=TOP+ROWH*maxRows/2});
  for(let it=0;it<5;it++)LAYERS.forEach(L=>{const ns=ind.filter(n=>n.lane===L.id);
    ns.forEach(n=>{const ys=E.filter(e=>e.a===n||e.b===n).map(e=>e.a===n?e.b:e.a).filter(m=>m.kind==="ind"&&typeof m.lane==="number"&&m.lane!==n.lane).map(m=>m.y);n.bc=ys.length?ys.reduce((a,b)=>a+b,0)/ys.length:n.y});
    ns.sort((a,b)=>a.bc-b.bc);const h=ROWH*maxRows,gap=h/ns.length;ns.forEach((n,i)=>{n.y=TOP+gap*(i+.5)})});
}
let gLane,gEdge,gPart,gNode,mini;
function render(){
  root.innerHTML="";gLane=el("g");gEdge=el("g");gPart=el("g");gNode=el("g");root.append(gLane,gEdge,gPart,gNode);
  const maxRows=Math.max(...LAYERS.map(L=>L.ids.length));
  LAYERS.forEach(L=>{const x=laneX(L.id);
    if(L.id%2)gLane.appendChild(el("rect",{class:"lane-band",x:x-COLW/2,y:TOP-40,width:COLW,height:ROWH*maxRows+56,rx:14}));
    const t=el("text",{class:"lane-label",x,y:TOP-52,"text-anchor":"middle"});t.textContent=L.name;gLane.appendChild(t);
    const s=el("text",{class:"lane-sub",x,y:TOP-36,"text-anchor":"middle"});s.textContent=L.sub;gLane.appendChild(s);
    if(L.id<LAYERS.length-1){const a=el("text",{class:"lane-sub",x:x+COLW/2,y:TOP-44,"text-anchor":"middle"});a.textContent="→";a.style.fontSize="16px";gLane.appendChild(a)}});
  const tl=el("text",{class:"lane-label",x:PADX-140,y:WH-48});tl.textContent="금융·부동산";gLane.appendChild(tl);
  const ts=el("text",{class:"lane-sub",x:PADX-140,y:WH-34});ts.textContent="가로층 · 모든 층과 연결";gLane.appendChild(ts);
  E.forEach(e=>{const dash=!(e.type==="SUPPLIES_TO"||e.type==="THEME_DRIVES"||e.type==="OPERATES_IN");
    e.el=el("path",{class:"edge k-"+e.type+(dash?" dash":"")+(e.far?" far":"")});
    e.el.addEventListener("mouseenter",ev=>showTip(ev,`<b>${esc(e.a.name)}</b> → <b>${esc(e.b.name)}</b><div class="m">${e.type} · ${e.strength||"-"}</div>${e.mech?"<div style='margin-top:4px'>"+esc(e.mech)+"</div>":""}`));
    e.el.addEventListener("mousemove",moveTip);e.el.addEventListener("mouseleave",hideTip);gEdge.appendChild(e.el)});
  N.forEach(n=>{const g=el("g",{class:"node "+n.kind+(n.kind==="theme"?" theme":"")+(n.tier?" tier-"+n.tier:"")});n.el=g;g.style.setProperty("--rr",(n.r+6)+"px");
    if(n.kind==="theme"){g.appendChild(el("polygon",{points:"0,-12 12,0 0,12 -12,0",fill:"#C9B88A","fill-opacity":.85}))}

function nodeTip(n){

  if(n.kind==="theme")return`<b>${esc(n.name)}</b><div class="m">테마 · 연결 ${E.filter(e=>e.a===n).length}</div>`;

function showTip(ev,html){tip.innerHTML=html;tip.style.opacity=1;moveTip(ev)}
function moveTip(ev){const r=stage.getBoundingClientRect();let x=ev.clientX-r.left+14,y=ev.clientY-r.top+14;if(x+330>r.width)x=ev.clientX-r.left-330;if(y+110>r.height)y=ev.clientY-r.top-100;tip.style.left=x+"px";tip.style.top=y+"px"}

const path=e=>{const a=e.a,b=e.b;if(e.type==="OPERATES_IN")return`M${a.x},${a.y}L${b.x},${b.y}`;const dx=b.x-a.x;if(Math.abs(dx)<60){const s=a.x<WW/2?1:-1;return`M${a.x},${a.y}C${a.x+s*70},${a.y} ${b.x+s*70},${b.y} ${b.x},${b.y}`}const c=Math.min(Math.abs(dx)*.5,260)*Math.sign(dx);return`M${a.x},${a.y}C${a.x+c},${a.y} ${b.x-c},${b.y} ${b.x},${b.y}`};
let t0=performance.now();
function tick(){
  if(tween){const p=Math.min(1,(performance.now()-tween.t)/tween.d),s=p<.5?2*p*p:-1+(4-2*p)*p;view.x=tween.x0+(tween.x1-tween.x0)*s;view.y=tween.y0+(tween.y1-tween.y0)*s;view.k=tween.k0+(tween.k1-tween.k0)*s;if(p>=1)tween=null}

  root.classList.toggle("z-mid",view.k<.72&&view.k>=.5);root.classList.toggle("z-far",view.k<.5);
  E.forEach(e=>{const h=e.a.hidden||e.b.hidden;e.el.style.display=h?"none":"";if(!h)e.el.setAttribute("d",path(e))});
  N.forEach(n=>{n.el.style.display=n.hidden?"none":"";n.el.setAttribute("transform",`translate(${n.x},${n.y})`)});
  particles();updateMini();requestAnimationFrame(tick);
}
function particles(){
  if(RED)return;const t=(performance.now()-t0)/1000;
  const lit=E.filter(e=>!e.a.hidden&&!e.b.hidden&&e.type==="SUPPLIES_TO"&&((sel||hov)?e.el.classList.contains("lit1"):!e.far));
  while(gPart.childNodes.length<lit.length*2)gPart.appendChild(el("circle",{class:"particle",r:1.7}));
  while(gPart.childNodes.length>lit.length*2)gPart.lastChild.remove();
  lit.forEach((e,i)=>{const L=e.el.getTotalLength();for(let j=0;j<2;j++){const c=gPart.childNodes[i*2+j];const u=((t*.11+i*.37+j*.5)%1);const p=e.el.getPointAtLength(u*L);c.setAttribute("cx",p.x);c.setAttribute("cy",p.y);c.setAttribute("opacity",(sel||hov)?.95:.28)}});

function neighbors(n){const one=new Set(),two=new Set();E.forEach(e=>{if(e.a===n)one.add(e.b);if(e.b===n)one.add(e.a)});one.forEach(m=>E.forEach(e=>{if(e.a===m&&e.b!==n&&!one.has(e.b))two.add(e.b);if(e.b===m&&e.a!==n&&!one.has(e.a))two.add(e.a)}));return{one,two}}
function light(n,cls){
  N.forEach(m=>m.el.classList.remove("sel","off","lit2","hov"));E.forEach(e=>e.el.classList.remove("lit1","lit2","off"));
  if(!n)return;const{one,two}=neighbors(n);

}
function hover(n){hov=n;if(sel)return;light(n,"hov");applyFilters()}

    const m={id:n.id+"::"+c.ticker,kind:"co",name:c.ticker,cp:c.chain_position||"",role:c.role,dd:dd.has(c.ticker),parent:n,lane:n.lane,r:c.role==="REGIME_LEADER"?5.5:4,x,y,ref:c};N.push(m);byId[m.id]=m;E.push({a:n,b:m,type:"OPERATES_IN",strength:"L",mech:c.note||""})});

function applyFilters(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  N.forEach(n=>{let h=false;if(n.kind==="ind"&&!tiers.has(n.tier))h=true;if(crossHidden&&n.lane==="X")h=true;if(n.kind==="co"&&n.parent.hidden)h=true;n.hidden=h;

}
function measure(){VW=svg.clientWidth||1200;VH=svg.clientHeight||700}
function clamp(){view.k=Math.max(.3,Math.min(2.8,view.k));const w=WW*view.k,h=WH*view.k;
  view.x=w<VW?(VW-w)/2:Math.max(VW-w-40,Math.min(40,view.x));view.y=h<VH?(VH-h)/2:Math.max(VH-h-40,Math.min(40,view.y))}
function fitView(anim){measure();const k=Math.min((VW-40)/WW,(VH-40)/WH);const x=(VW-WW*k)/2,y=(VH-WH*k)/2;if(anim&&!RED)tween={t:performance.now(),d:380,x0:view.x,y0:view.y,k0:view.k,x1:x,y1:y,k1:k};else view={x,y,k}}
function zoomAt(f,cx,cy){tween=null;const k=Math.max(.3,Math.min(2.8,view.k*f));view.x=cx-(cx-view.x)*k/view.k;view.y=cy-(cy-view.y)*k/view.k;view.k=k;clamp()}
svg.addEventListener("wheel",ev=>{ev.preventDefault();tween=null;const r=svg.getBoundingClientRect();

svg.addEventListener("pointerdown",ev=>{if(ev.button!==0)return;tween=null;panning={x:ev.clientX,y:ev.clientY,vx:view.x,vy:view.y};svg.classList.add("dragging")});

  if(dragN){const d=Math.hypot(ev.clientX-dragN.sx,ev.clientY-dragN.sy);if(d>3)dragN.moved=true;if(!dragN.moved)return;const n=dragN.n,r=svg.getBoundingClientRect(),p={x:(ev.clientX-r.left-view.x)/view.k,y:(ev.clientY-r.top-view.y)/view.k};

function inspectEmpty(){document.getElementById("insp").innerHTML=`<div class="empty">노드를 선택하면 카드가 여기에 열립니다.<br><br>
<b>배치</b>는 밸류체인 순서로 고정돼 있습니다 — 왼쪽이 원자재·에너지, 오른쪽이 최종 수요. 위에는 수요를 내리는 테마, 아래는 모든 층과 닿는 금융·부동산. 갱신해도 자리가 바뀌지 않으니 눈에 익혀 두세요.<br><br>

function replay(){
