<!DOCTYPE html>
<html lang='ko'><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Global Sector Atlas · Heatmap</title>
<link rel='preconnect' href='https://cdn.jsdelivr.net'>
<link rel='stylesheet' href='https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css'>
<link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap'>
<style>
:root{
 --paper:#EBEAE4; --panel:#F3F2ED; --ink:#181B1E; --soft:#5A5F63; --line:#D2D1C9;
 --heat:#A6331A; --warm:#B0771A; --neutral:#7E858A; --cold:#3C6C8C; --frozen:#AFB4B6;
 --mono:'IBM Plex Mono',ui-monospace,monospace;
 --sans:'Pretendard','Pretendard Variable',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
 font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
a{color:inherit;text-decoration:none}
h2,h3,h4{margin:0;font-weight:650;letter-spacing:-0.01em}
.mono{font-family:var(--mono)}

/* header */
.masthead{border-bottom:2px solid var(--ink);padding:30px 0 18px;margin-bottom:6px}
.xnav{display:flex;gap:3px;padding-top:22px}
.xnav a{font-family:var(--mono,monospace);font-size:11px;letter-spacing:.05em;color:var(--soft);
 text-decoration:none;padding:6px 13px;border-radius:4px;border:1px solid transparent;transition:.14s}
.xnav a:hover{color:var(--ink);background:var(--panel)}
.xnav a.cur{color:var(--ink);background:#fff;border-color:var(--line)}
.mrow{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}
.title{font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.34em;color:var(--soft)}
.h1{font-size:40px;font-weight:750;letter-spacing:-.03em;line-height:1.02;margin:.12em 0 0}
.asof{font-family:var(--mono);font-size:13px;color:var(--soft);text-align:right}
.asof b{color:var(--ink);font-size:22px;font-weight:600;display:block;letter-spacing:-.02em}
.notice{margin-top:14px;font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;color:var(--soft);
 display:flex;gap:20px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.notice b{color:var(--heat)}

section.block{padding:38px 0;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.28em;color:var(--soft);
 text-transform:uppercase;margin-bottom:4px}
.blocktitle{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-bottom:18px}
.lead{color:var(--soft);max-width:70ch;margin:-8px 0 20px}

/* thermal grid */
.grid{display:flex;flex-direction:column;gap:5px}
.grid .row{display:grid;grid-template-columns:118px 1fr;gap:8px;align-items:stretch}
.rlab{font-family:var(--mono);font-size:12px;color:var(--soft);display:flex;align-items:center;
 justify-content:space-between;padding-right:8px;border-right:1px solid var(--line)}
.rcount{opacity:.5;font-size:10px}
.cells{display:flex;flex-wrap:wrap;gap:5px}
.cell{flex:1 1 96px;min-width:88px;border-radius:3px;padding:8px 9px;display:flex;flex-direction:column;
 justify-content:space-between;min-height:52px;border:1px solid rgba(0,0,0,.06);transition:transform .08s}
.cell:hover{transform:translateY(-2px);box-shadow:0 3px 10px rgba(0,0,0,.14)}
.cn{font-size:12px;font-weight:600;line-height:1.18;letter-spacing:-.01em}
.ct{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;opacity:.85;margin-top:4px}
.t-HEAT{background:var(--heat);color:#fff}
.t-WARM{background:var(--warm);color:#fff}
.t-NEUTRAL{background:#E4E3DC;color:var(--soft)}
.t-COLD{background:var(--cold);color:#fff}
.t-FROZEN{background:#DEDDD7;color:#9A9FA2}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px;font-family:var(--mono);font-size:10.5px}
.legend span{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 3px;border-radius:20px;background:var(--panel)}
.sw{width:15px;height:15px;border-radius:3px;display:inline-block}

/* reconciliation */
.recon-top{display:flex;gap:26px;flex-wrap:wrap;align-items:baseline;margin-bottom:18px}
.bignum{font-family:var(--mono);font-weight:600;font-size:15px;color:var(--soft)}
.bignum b{font-size:34px;color:var(--ink);letter-spacing:-.02em}
.bignum .arrow{color:var(--heat);padding:0 6px}
.demote{background:var(--panel);border-left:3px solid var(--warm);padding:12px 16px;border-radius:0 6px 6px 0;
 margin-bottom:20px;font-size:14px}
.demote b{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--warm)}
table.rank{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px}
table.rank th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--soft);
 text-transform:uppercase;padding:6px 10px;border-bottom:1px solid var(--ink)}
table.rank td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.rk-id{font-family:var(--mono);font-weight:600;font-size:12px}
.rk-sc{font-family:var(--mono);font-weight:600;text-align:center;width:44px}
.rk-res{font-family:var(--mono);font-size:11px;letter-spacing:.06em;width:88px}
.rk-det{color:var(--soft);font-size:12px;font-family:var(--mono)}
tr.res-heat .rk-res{color:var(--heat);font-weight:600}
tr.res-warm{background:rgba(176,119,26,.06)}
tr.res-warm .rk-res{color:var(--warm);font-weight:600}
.tiebreak{font-size:12.5px;color:var(--soft);font-family:var(--mono);margin-top:8px;
 padding:10px 12px;background:var(--panel);border-radius:6px}
.scrline{margin-top:22px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scrline .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--soft);text-transform:uppercase}
.pill{padding:5px 12px;border-radius:20px;font-size:13px;font-weight:600}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 18px 14px;
 border-top:3px solid var(--line)}
.card.tier-HEAT{border-top-color:var(--heat)}
.card.tier-WARM{border-top-color:var(--warm)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.card-id{font-family:var(--mono);font-size:11px;color:var(--soft);letter-spacing:.06em}
.card-h h3{font-size:19px;flex:1;letter-spacing:-.02em}
.tier-badge{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;
 padding:3px 9px;border-radius:4px;color:#fff}
.tier-badge.t-HEAT{background:var(--heat)} .tier-badge.t-WARM{background:var(--warm)}
.defn{color:var(--soft);font-size:13.5px;margin:0 0 12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--soft);
 text-transform:uppercase;margin:0 0 5px}
.card section p{margin:0 0 6px;font-size:13.5px}
.muted{color:var(--soft);font-size:12px !important}
.meters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.meter{font-family:var(--mono);font-size:11px;background:var(--paper);border:1px solid var(--line);
 padding:5px 9px;border-radius:5px;color:var(--ink)}
.meter em{color:var(--soft);font-style:normal;letter-spacing:.1em;margin-right:5px;font-size:9.5px;text-transform:uppercase}
.meter.sm{font-size:10px}
.li-wrap{margin:10px 0}
.li{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0;border-bottom:1px dotted var(--line)}
.li-n{color:var(--ink)} .li-v{font-family:var(--mono);font-size:11.5px;color:var(--soft);text-align:right}
.li-d{display:block;font-size:9.5px;opacity:.7}
.trig p{font-size:12.5px;color:var(--soft);margin:0}
.rat{margin-top:12px;background:var(--paper);border-radius:6px;padding:11px 13px}
.rat p{margin:0;font-size:12.5px;line-height:1.55}
.chips{margin-top:12px;display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;font-family:var(--mono);background:var(--paper);border:1px solid var(--line);
 padding:3px 8px;border-radius:20px;color:var(--soft)}
.chip b{color:var(--ink)} .chip i{color:var(--heat);font-style:normal}
.edges{margin-top:12px}
.edges summary{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--soft);
 cursor:pointer;text-transform:uppercase}
.edges ul{list-style:none;padding:8px 0 0;margin:0}
.edges li{font-size:12px;padding:5px 0;border-bottom:1px dotted var(--line)}
.etype{font-family:var(--mono);font-size:10px;background:var(--paper);padding:1px 6px;border-radius:4px;color:var(--soft)}
.estr{font-family:var(--mono);font-size:10px;color:var(--soft)}
.emech{display:block;color:var(--soft);font-size:11px;margin-top:2px}

/* candidates */
.axnote{font-size:12.5px;color:var(--soft);font-family:var(--mono);background:var(--panel);
 padding:12px 14px;border-radius:6px;margin-bottom:18px}
.cand-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.cand{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:15px;border-left:3px solid}
.cand.bucket-A{border-left-color:var(--heat)}
.cand.bucket-B{border-left-color:var(--cold)}
.cand.bucket-C{border-left-color:var(--warm)}
.cand header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bk{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;padding:2px 7px;border-radius:4px;
 background:var(--ink);color:var(--paper)}
.bkn{font-size:12px;color:var(--soft);flex:1}
.ct2{font-family:var(--mono);font-size:10px;color:var(--soft)}
.cand h4{font-size:15px;letter-spacing:-.01em;margin-bottom:7px}
.cand .why{font-size:12.5px;margin:0 0 9px}
.cand .fx,.cand .hz{font-size:12px;color:var(--soft);margin:5px 0}
.cand .fx b,.cand .hz b{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink);
 display:block;text-transform:uppercase;margin-bottom:1px}

/* peak watch + withheld */
.pw-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.pwitem{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;border-left:3px solid var(--warm)}
.pwh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pwitem p{font-size:12.5px;margin:5px 0;color:var(--soft)}
.trip b{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--warm);text-transform:uppercase}
.withheld{font-size:12.5px;color:var(--soft)}
.withheld ul{padding-left:18px} .withheld b{color:var(--ink);font-family:var(--mono);font-size:11px}

/* cold */
.cold-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.cold-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:15px;
 border-left:3px solid var(--cold)}
.cold-item header{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.cold-item h4{font-size:16px;flex:1}
.cold-item .rat{background:var(--paper)}

/* neutral list */
.ol-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:6px}
.ol{display:flex;align-items:center;gap:10px;padding:8px 11px;background:var(--panel);border-radius:6px;
 border:1px solid var(--line);font-size:13px}
.ol:hover{border-color:var(--soft)}
.ol-id{font-family:var(--mono);font-size:10.5px;color:var(--soft);width:52px}
.ol-n{flex:1;font-weight:550}
.ol-m{font-family:var(--mono);font-size:10px;color:var(--soft)}
.ol.t-COLD .ol-id{color:var(--cold)}

/* themes */
.theme-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.theme{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.theme h4{font-size:15px;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.tid{font-family:var(--mono);font-size:10px;color:var(--soft);letter-spacing:.06em}
.theme p{font-size:12.5px;color:var(--soft);margin:0 0 8px}
.tlinks{display:flex;flex-wrap:wrap;gap:5px}
.tlinks a{font-size:11px;font-family:var(--mono);color:var(--soft);border-bottom:1px solid var(--line)}
.tlinks a:hover{color:var(--ink)}

footer{padding:34px 0 60px;color:var(--soft);font-size:12px;font-family:var(--mono);line-height:1.7}
footer b{color:var(--ink)}
.jump{position:sticky;top:0;z-index:5;background:rgba(235,234,228,.92);backdrop-filter:blur(6px);
 border-bottom:1px solid var(--line);padding:9px 0;font-family:var(--mono);font-size:11px}
.jump .wrap{display:flex;gap:16px;flex-wrap:wrap}
.jump a{color:var(--soft);letter-spacing:.06em} .jump a:hover{color:var(--heat)}
@media(max-width:720px){
 .h1{font-size:29px} .cards,.cand-wrap,.cold-wrap,.pw-wrap{grid-template-columns:1fr}
 .grid2{grid-template-columns:1fr} .grid .row{grid-template-columns:80px 1fr}
 .rlab{font-size:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;scroll-behavior:auto}}
</style></head>

  <div class='asof' id='asof'>로딩 중…</div>
 </div>
 <div class='notice'>
  <span><b>티어 = 조사 우선순위이며 매매 신호가 아님.</b></span>

  <span>기업명은 대표·주목 나열이며 종목 판단·목표가 없음 (UNVERIFIED)</span>
 </div>

<main id='app'><div style="padding:60px 0;font-family:var(--mono);color:var(--soft)">데이터 로딩 중…</div></main>
<footer id='foot'></footer>
</div>
<script>/* ATLAS derive.js — PACK(원본) 하나로 graph/console 파생 데이터를 만든다.
   파이썬 extract_graph.py + extract_console.py의 1:1 포팅.
   브라우저(fetch 후)와 Node(검증) 양쪽에서 동작. */
(function(root){
  const SEC_CODE={'에너지':'ENE','소재':'MAT','산업재':'IND','유틸리티':'UTL','IT':'ITC',
    '커뮤니케이션':'COM','헬스케어':'HLT','금융':'FIN','부동산':'RLE','필수소비재':'STP','임의소비재':'DIS'};

  function deriveGraph(d){
    const nodes=[]; const node_ids=new Set();
    // verification map from company_nodes ledger
    const VER={};
    for(const c of (d.company_nodes||[])){
      VER[c.ticker]=[c.verification||'SHALLOW', c.deep_dive_ref||null];
    }
    // theme nodes
    for(const t of d.themes){
      nodes.push({id:t.id, kind:'theme', label:t.name,
        thesis:t.demand_thesis||'', linked:t.linked_industries||[]});
      node_ids.add(t.id);
    }
    // industry nodes (all)
    for(const ind of d.industries){
      const comps=(ind.companies||[]).map(c=>{
        const v=VER[c.ticker]||['SHALLOW',null];
        return {ticker:c.ticker, name:c.name, chain:c.chain_position||'',
          role:(c.role!==undefined?c.role:null), role_reason:c.role_reason||'', note:c.note||'',
          verification:v[0], deep_dive_ref:v[1]};
      });
      const li=ind.leading_indicators||[];
      nodes.push({
        id:ind.id, kind:'industry', label:ind.name, sector:ind.sector, tier:ind.tier,
        definition:ind.definition||'', balance:ind.balance||'', balance_dir:ind.balance_direction||'',
        cycle:ind.cycle_stage||'', demand:ind.demand||{}, supply:ind.supply||{},
        leading:li.map(x=>({name:x.name, reading:x.last_reading, as_of:x.as_of})),
        triggers:ind.triggers_watchlist||[], tier_rationale:ind.tier_rationale||'',
        market_read:ind.market_read||{}, companies:comps});
      node_ids.add(ind.id);
    }
    // company_role map (ticker -> {...}); last write wins, same as python dict
    const cand_ids=new Set((d.monthly_diff&&d.monthly_diff.deep_dive_candidates||[]).map(c=>c.id));
    const company_role=new Map();
    for(const ind of d.industries){
      for(const c of (ind.companies||[])){
        const _dd=(VER[c.ticker]&&VER[c.ticker][0]==='DEEP_DIVED');
        if(c.role||_dd){ company_role.set(c.ticker,{role:c.role||null,reason:c.role_reason||'',indid:ind.id,name:c.name,tier:ind.tier}); }
      }
    }
    const comp_edges=[];
    for(const [tk,v] of company_role){
      const cid='C::'+tk;
      if(node_ids.has(cid)) continue;
      const vr=VER[tk]||['SHALLOW',null];
      nodes.push({id:cid, kind:'company', label:v.name||tk, ticker:tk,
        role:v.role, role_reason:v.reason, industry:v.indid, tier:v.tier, is_candidate:cand_ids.has(tk),
        verification:vr[0], deep_dive_ref:vr[1]});
      node_ids.add(cid);
      comp_edges.push({type:'OPERATES_IN',from:cid,to:v.indid,direction:'+',strength:'H',
        mechanism:'이 기업의 주 사업이 해당 산업에 속함',lag:'즉시',role:v.role});
    }
    // industry/theme edges where both ends exist
    const edges=[];
    const EK=['type','from','to','direction','strength','mechanism','lag'];
    for(const e of d.edges){
      if(node_ids.has(e.from)&&node_ids.has(e.to)){
        const o={}; for(const k of EK) o[k]=(e[k]!==undefined?e[k]:null); edges.push(o);
      }
    }
    for(const e of comp_edges) edges.push(e);
    // sectors ordered
    const sectors=[]; for(const ind of d.industries){ if(!sectors.includes(ind.sector)) sectors.push(ind.sector); }
    return {
      meta:{as_of:d.meta.as_of, version:d.meta.version, os_version:d.meta.os_version,
        n_industries:d.industries.length, n_edges:d.edges.length},
      sectors, nodes, edges};
  }

  function deriveConsole(d, g){
    const sectors=g.sectors.map(s=>({name:s, code:SEC_CODE[s]||s.slice(0,3)}));
    const edges_by_node={};
    for(const e of g.edges){
      (edges_by_node[e.from]=edges_by_node[e.from]||[]).push(e);
      (edges_by_node[e.to]=edges_by_node[e.to]||[]).push(e);
    }
    const id2label={}; for(const n of g.nodes) id2label[n.id]=(n.label!==undefined?n.label:n.id);
    const inds=[];
    for(const n of g.nodes){
      if(n.kind!=='industry') continue;
      const nb=[];
      for(const e of (edges_by_node[n.id]||[])){
        if(e.type==='OPERATES_IN') continue;
        const other = e.from===n.id ? e.to : e.from;
        nb.push({type:e.type, dir: e.from===n.id?'→':'←', other:(id2label[other]!==undefined?id2label[other]:other),
          other_id:other, strength:e.strength||'', mechanism:e.mechanism||''});
      }
      inds.push({id:n.id, sector:n.sector, name:n.label, definition:n.definition||'',
        tier:n.tier, status:'BUILT', balance:n.balance||'', balance_dir:n.balance_dir||'', cycle:n.cycle||'',
        demand:n.demand||{}, supply:n.supply||{}, leading:n.leading||[], triggers:n.triggers||[],
        rationale:n.tier_rationale||'', market_read:n.market_read||{},
        companies:(n.companies||[]).map(c=>({ticker:c.ticker,name:c.name,chain:c.chain||'',
          role:(c.role!==undefined?c.role:null),role_reason:c.role_reason||'',
          verification:c.verification||'SHALLOW',deep_dive_ref:c.deep_dive_ref||null,note:c.note||''})),
        edges:nb});
    }
    const themes=d.themes.map(t=>({name:t.name, thesis:t.demand_thesis||'',
      n:(t.linked_industries||[]).length, linked:t.linked_industries||[]}));
    const diff=d.monthly_diff||{};
    const cands=(diff.deep_dive_candidates||[]).map(c=>({id:c.id,name:c.name,bucket:c.bucket,tier:c.tier,
      role:(c.role!==undefined?c.role:undefined),why:c.why,falsifier:c.falsifier,horizon:c.horizon}));
    const peak=(diff.peak_watch||[]).map(p=>({id:p.id,name:p.name,tier:p.tier,reason:p.reason,tripwire:p.tripwire}));
    const tiers=[{k:'HEAT',label:'HEAT',desc:'수급 균형 붕괴 · 즉시 스크리닝'},
      {k:'WARM',label:'WARM',desc:'트리거 조짐 · 월간 관찰'},
      {k:'NEUTRAL',label:'NEUTRAL',desc:'균형 · 분기 확인'},
      {k:'COLD',label:'COLD',desc:'침체 · 바닥 반전 감시'},
      {k:'FROZEN',label:'FROZEN',desc:'구조적 쇠퇴 · 생존 확인'}];
    const edgetypes=[{sym:'→',name:'SUPPLIES_TO',desc:'산출물이 상대의 투입물'},
      {sym:'⇄',name:'SUBSTITUTES',desc:'수요를 대체'},
      {sym:'⋈',name:'CAPACITY_COMPETES',desc:'같은 생산능력 경쟁'},
      {sym:'≈',name:'DEMAND_COMOVES',desc:'같은 최종수요 노출'},
      {sym:'⊣',name:'INVERSE',desc:'호황이 상대엔 비용/압력'},
      {sym:'⇒',name:'THEME_DRIVES',desc:'테마가 수요 창출'}];
    const tc={}; for(const i of inds) tc[i.tier]=(tc[i.tier]||0)+1;
    return {meta:{as_of:d.meta.as_of,version:d.meta.version,os_version:d.meta.os_version,
        counts:{sectors:sectors.length,industries:inds.length,themes:themes.length,
          edges:d.edges.length,heat:tc.HEAT||0,warm:tc.WARM||0}},
      sectors,industries:inds,themes,tiers,edgetypes,diff:{candidates:cands,peak_watch:peak}};
  }

  const api={deriveGraph, deriveConsole,
    deriveAll(d){ const g=deriveGraph(d); return {graph:g, console:deriveConsole(d,g)}; }};
  if(typeof module!=='undefined'&&module.exports) module.exports=api;
  root.ATLAS_DERIVE=api;
})(typeof window!=='undefined'?window:globalThis);
</script>

<script>
(function(){
  const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;');
  const TIER_ORDER={HEAT:0,WARM:1,NEUTRAL:2,COLD:3,FROZEN:4};
  const SECTORS=['에너지','소재','산업재','유틸리티','IT','커뮤니케이션','헬스케어','금융','부동산','필수소비재','임의소비재'];
  const BUCKET={A:'신규 수요 급증',B:'바닥 반전',C:'확장 지속'};
  const balKo=b=>({SHORTAGE:'공급부족',BALANCED:'균형',GLUT:'공급과잉'}[b]||b||'—');
  const cycKo=c=>({RECOVERY:'회복초입',EXPANSION:'확장',PEAK:'피크권',DOWNTURN:'하강',TROUGH:'바닥권'}[c]||c||'—');
  let IDNAME={};

  function chip(c){const dd=c.verification==='DEEP_DIVED';
    return `<span class="chip" title="${esc(c.note||c.role_reason||'')}"><b>${esc(c.ticker)}</b> ${esc(c.name)}${dd?' <span style="color:#2f7d76;font-weight:700" title="딥다이브 검증 완료">✓</span>':''}</span>`;}

  function grid(inds){
    const bySec={}; inds.forEach(o=>(bySec[o.sector]=bySec[o.sector]||[]).push(o));
    return `<div class="grid">`+SECTORS.map(sec=>{
      const items=(bySec[sec]||[]).slice().sort((a,b)=>TIER_ORDER[a.tier]-TIER_ORDER[b.tier]);
      if(!items.length) return '';
      const cells=items.map(o=>`<a class="cell t-${o.tier}" href="#${o.id}" title="${esc(o.name)} · ${o.tier}"><span class="cn">${esc(o.name)}</span><span class="ct">${o.tier}</span></a>`).join('');
      return `<div class="row"><div class="rlab">${esc(sec)}<span class="rcount">${items.length}</span></div><div class="cells">${cells}</div></div>`;
    }).join('')+`</div>`;
  }

  function card(o){
    const d=o.demand||{},s=o.supply||{},mr=o.market_read||{};
    const li=(o.leading||[]).map(l=>`<div class="li"><span class="li-n">${esc(l.name)}</span><span class="li-v">${esc(l.reading||'—')}<span class="li-d">${esc(l.as_of||'')}</span></span></div>`).join('');
    const trig=(o.triggers||[]).map(esc).join('  ·  ');
    const chips=(o.companies||[]).map(chip).join('');
    const edges=(o.edges||[]).map(e=>`<li><span class="etype">${esc(e.type)}</span> ${e.dir==='→'?'→':'←'} ${esc(e.other)} <span class="estr">[${esc(e.strength)}]</span><span class="emech">${esc(e.mechanism)}</span></li>`).join('');
    return `<article class="card tier-${o.tier}" id="${o.id}">
      <header class="card-h"><div class="card-id">${o.id}</div><h3>${esc(o.name)}</h3><span class="tier-badge t-${o.tier}">${o.tier}</span></header>
      <p class="defn">${esc(o.definition)}</p>
      <div class="grid2">
        <section><h4>수요</h4><p>${esc(d.drivers||'')}</p>
          <p class="muted"><b>구조 vs 경기:</b> ${esc(d.secular_vs_cyclical||'—')} · <b>모멘텀:</b> ${esc(d.momentum||'—')}</p></section>
        <section><h4>공급</h4><p>${esc(s.structure||'')}</p>
          <p class="muted"><b>리드타임:</b> ${esc(s.lead_time||'—')}${s.utilization_inventory?` · <b>가동·재고:</b> ${esc(s.utilization_inventory)}`:''}${s.barriers?` · <b>진입장벽:</b> ${esc(s.barriers)}`:''}</p></section>
      </div>
      <div class="meters"><span class="meter"><em>수급</em> ${balKo(o.balance)}${o.balance_dir?' · '+esc(o.balance_dir):''}</span>
        <span class="meter"><em>사이클</em> ${cycKo(o.cycle)}</span>
        <span class="meter"><em>인지</em> ${esc(mr.consensus||'—')} / ${esc(mr.momentum||'—')}</span></div>
      ${li?`<div class="li-wrap"><h4>선행지표</h4>${li}</div>`:''}
      ${trig?`<div class="trig"><h4>잠재 트리거</h4><p>${trig}</p></div>`:''}
      ${o.rationale?`<div class="rat"><h4>티어 근거</h4><p>${esc(o.rationale)}</p></div>`:''}
      ${chips?`<div class="chips">${chips}</div>`:''}
      ${edges?`<details class="edges"><summary>온톨로지 엣지 · ${(o.edges||[]).length}</summary><ul>${edges}</ul></details>`:''}
    </article>`;
  }

  function coldItem(o){
    const chips=(o.companies||[]).map(chip).join('');
    return `<article class="cold-item" id="${o.id}"><header><span class="card-id">${o.id}</span><h4>${esc(o.name)}</h4>
      <span class="meter sm">${esc(o.cycle||'')} · ${esc((o.market_read||{}).momentum||'')}</span></header>
      <p class="rat">${esc(o.rationale)}</p>${chips?`<div class="chips sm">${chips}</div>`:''}</article>`;
  }

  function neutralOl(o){
    return `<a class="ol t-NEUTRAL" href="#${o.id}"><span class="ol-id">${o.id}</span><span class="ol-n">${esc(o.name)}</span><span class="ol-m">${esc(o.balance)} · ${esc(o.cycle)}</span></a>`;
  }

  function diffSection(md){
    if(!md) return '';
    let h=`<section class="block" id="recon"><div class="eyebrow">Monthly Diff · 이번 갱신</div><div class="blocktitle">이번에 무엇이 바뀌었나</div>`;
    if(md.note) h+=`<p class="lead">${esc(md.note)}</p>`;
    (md.upgrades||[]).forEach(u=>{ h+=`<div class="demote" style="border-left-color:var(--heat)"><b style="color:var(--heat)">▲ 상향 · ${esc(u.name)} ${esc(u.from)} → ${esc(u.to)}</b><br>${(u.evidence||[]).map(esc).join(' · ')}${u.caveat?`<br><span style="color:var(--soft)">⚠ ${esc(u.caveat)}</span>`:''}</div>`; });
    (md.downgrades||[]).forEach(u=>{ h+=`<div class="demote"><b>▼ 하향 · ${esc(u.name)} ${esc(u.from)} → ${esc(u.to)}</b><br>${(u.evidence||[]).map(esc).join(' · ')}</div>`; });
    if(md.node_promotions&&md.node_promotions.length){
      h+=`<table class="rank"><thead><tr><th>티커</th><th>산업</th><th>승격</th><th>딥다이브 스탠스</th></tr></thead><tbody>`+
        md.node_promotions.map(p=>`<tr><td class="rk-id">${esc(p.ticker)}</td><td>${esc(p.industry)}</td><td class="rk-det">${esc(p.status)}</td><td>${esc(p.stance)}</td></tr>`).join('')+`</tbody></table>`;
    }
    if(md.new_triggers&&md.new_triggers.length) h+=`<div class="trig"><h4>새 트리거</h4>`+md.new_triggers.map(t=>`<p class="muted">· ${esc(t)}</p>`).join('')+`</div>`;
    if(md.propagation_paths&&md.propagation_paths.length) h+=`<div class="trig"><h4>전파 경로 (Propagation)</h4>`+md.propagation_paths.map(p=>`<p class="muted">${esc(p)}</p>`).join('')+`</div>`;
    const sr=md.screening_recommendations||{};
    if(sr.HEAT&&sr.HEAT.length) h+=`<div class="scrline"><span class="lbl">즉시 스크리닝 (HEAT)</span>`+sr.HEAT.map(s=>`<a class="pill t-HEAT" href="#${s.id}">${esc(s.name)}</a>`).join('')+`</div>`;
    if(sr.new_warm_to_watch&&sr.new_warm_to_watch.length) h+=`<div class="scrline"><span class="lbl">신규 WARM 관찰</span>`+sr.new_warm_to_watch.map(s=>`<a class="pill t-WARM" href="#${s.id}">${esc(s.name)}</a>`).join('')+`</div>`;
    if(md.coverage_honesty) h+=`<p class="lead" style="margin-top:20px;font-size:13px">${esc(md.coverage_honesty)}</p>`;
    h+=`</section>`; return h;
  }

  function candSection(cands){
    if(!cands||!cands.length) return '';
    return `<section class="block" id="cand"><div class="eyebrow">Deep-Dive Candidates · 3축 버킷</div><div class="blocktitle">딥다이브 후보</div>
      <div class="axnote">티어(온도)만으로 뽑지 않는다. 축① 수급 · 축② 사이클×변화율 · 축③ 시장 인지를 결합해 3개 버킷으로 선별한다. 버킷 A(신규 수요·저인지) / B(바닥 반전·신호 확인) / C(확장 지속·눌림 대기). 후보는 모두 verification=SHALLOW이며, 각 산업을 데운 <b>바로 그 트리거에 가장 크게 노출된</b> 기업이다. 반증조건·시간지평 필수.</div>
      <div class="cand-wrap">`+cands.map(c=>`<article class="cand bucket-${c.bucket}">
        <header><span class="bk">버킷 ${c.bucket}</span><span class="bkn">${esc(BUCKET[c.bucket]||'')}</span><span class="ct2">${esc(c.tier)}</span></header>
        <h4>${esc(c.id)} · ${esc(c.name)}${c.carry_forward?' <span style="font-size:11px;color:var(--soft);font-weight:400">(carry-forward)</span>':''}</h4>
        <p class="why">${esc(c.why)}</p>
        <p class="fx"><b>반증조건</b> ${esc(c.falsifier)}</p>
        <p class="hz"><b>시간지평</b> ${esc(c.horizon)}</p></article>`).join('')+`</div></section>`;
  }

  function peakSection(pw, withheld){
    if((!pw||!pw.length)&&(!withheld||!withheld.length)) return '';
    let h=`<section class="block" id="peak"><div class="eyebrow">Peak-Out Watch · 후보 아님</div><div class="blocktitle">피크아웃 감시 (보유·차익 관점)</div>
      <p class="lead">선행지표가 롤오버하기 시작했거나 일시 이벤트가 온도를 부풀린 HEAT/WARM 산업. 매수 후보에서 빼고 tripwire를 명시한다.</p>`;
    if(pw&&pw.length) h+=`<div class="pw-wrap">`+pw.map(p=>`<div class="pwitem"><div class="pwh"><b>${esc(p.id)} · ${esc(p.name)}</b><span class="tier-badge t-${p.tier}">${p.tier}</span></div><p>${esc(p.reason)}</p><p class="trip"><b>tripwire</b> ${esc(p.tripwire)}</p></div>`).join('')+`</div>`;
    if(withheld&&withheld.length) h+=`<div class="withheld"><b>후보 보류 사유</b><ul>`+withheld.map(w=>`<li>${esc(w)}</li>`).join('')+`</ul></div>`;
    h+=`</section>`; return h;
  }

  function themeSection(themes){
    if(!themes||!themes.length) return '';
    return `<section class="block" id="themes"><div class="eyebrow">Cross-Sector Theme Layer</div><div class="blocktitle">크로스 섹터 테마 · ${themes.length}</div>
      <p class="lead">산업을 가로지르는 수요 원천. 테마는 카드를 대체하지 않고 THEME_DRIVES 엣지로 산업에 연결돼 트리거를 전파한다.</p>
      <div class="theme-wrap">`+themes.map(t=>{
        const links=(t.linked_industries||[]).map(id=>`<a href="#${id}">${esc(IDNAME[id]||id)}</a>`).join(' ');
        return `<article class="theme"><h4>${esc(t.name)}<span class="tid">${esc(t.id||'')}</span></h4><p>${esc(t.demand_thesis||'')}</p><div class="tlinks">${links}</div></article>`;
      }).join('')+`</div></section>`;
  }

  function render(con, md, meta){
    const inds=con.industries;
    IDNAME={}; inds.forEach(o=>IDNAME[o.id]=o.name);
    const tc={}; inds.forEach(o=>tc[o.tier]=(tc[o.tier]||0)+1);
    const total=inds.length, heat=tc.HEAT||0, pct=(heat/total*100).toFixed(1);
    document.getElementById('asof').innerHTML=`AS-OF<b>${esc(meta.as_of)}</b>커버리지 ${total}개 카드 · ${SECTORS.length}개 섹터<br>HEAT ${heat} / ${total} · ${pct}%`;

    const by=t=>inds.filter(o=>o.tier===t);
    let h='';
    h+=`<section class="block" id="dash"><div class="eyebrow">Thermal Dashboard</div><div class="blocktitle">지금 어디가 데워지고 있나</div>
      <p class="lead">${total}개 산업을 온도로 배열했다. 색은 유일하게 기능적인 장식 — 뜨거움(HEAT)에서 차가움(COLD)까지 수급 균형의 온도만 나타낸다. 셀을 누르면 해당 카드로 이동한다.</p>`+
      grid(inds)+
      `<div class="legend"><span><i class="sw t-HEAT"></i>HEAT · 균형 붕괴, 즉시 스크리닝</span><span><i class="sw t-WARM"></i>WARM · 조짐, 월간 관찰</span><span><i class="sw t-NEUTRAL"></i>NEUTRAL · 균형</span><span><i class="sw t-COLD"></i>COLD · 역발상 감시</span><span><i class="sw t-FROZEN"></i>FROZEN · 구조 쇠퇴</span></div></section>`;

    h+=diffSection(md);
    h+=candSection((md&&md.deep_dive_candidates)||[]);
    h+=peakSection((md&&md.peak_watch)||[], (md&&md.candidates_withheld)||[]);

    const heatC=by('HEAT');
    h+=`<section class="block" id="heat"><div class="eyebrow">Tier · HEAT — 균형이 깨졌거나 깨지는 중</div><div class="blocktitle">HEAT 산업 카드 · ${heatC.length}</div><div class="cards">`+heatC.map(card).join('')+`</div></section>`;
    const warmC=by('WARM');
    h+=`<section class="block" id="warm"><div class="eyebrow">Tier · WARM — 트리거 조짐, 월간 관찰</div><div class="blocktitle">WARM 산업 카드 · ${warmC.length}</div><div class="cards">`+warmC.map(card).join('')+`</div></section>`;
    const coldC=by('COLD').concat(by('FROZEN'));
    if(coldC.length) h+=`<section class="block" id="cold"><div class="eyebrow">Tier · COLD — 역발상 감시 목록</div><div class="blocktitle">COLD 산업 · ${coldC.length} <span style="font-size:13px;color:var(--soft);font-weight:400">다음 HEAT는 대부분 오늘의 COLD에서 나온다</span></div>
      <p class="lead">공급과잉·수요침체가 진행 중이나 무시 대상이 아니다. 각 카드에 <b>바닥 반전을 알릴 신호</b>를 명시한다. 신호가 실제 켜진 곳만 딥다이브 버킷 B로 승격된다 — COLD라는 사실만으로는 후보가 아니다.</p>
      <div class="cold-wrap">`+coldC.map(coldItem).join('')+`</div></section>`;
    const neuC=by('NEUTRAL');
    if(neuC.length) h+=`<section class="block" id="neutral"><div class="eyebrow">Tier · NEUTRAL</div><div class="blocktitle">균형 산업 요약 · ${neuC.length}</div>
      <p class="lead">균형 상태로 분기 1회 확인이면 충분한 산업. 카드 전문은 PACK에 보존된다.</p><div class="ol-wrap">`+neuC.map(neutralOl).join('')+`</div></section>`;
    h+=themeSection((typeof RAWTHEMES!=='undefined'&&RAWTHEMES)||[]);

    document.getElementById('app').innerHTML=h;
    document.getElementById('foot').innerHTML=`<b>고지</b> · 티어는 조사 우선순위이며 매매 신호가 아니다. 종목 레벨 판단·목표가·수익률 예측은 이 문서의 범위가 아니다. 기업명은 대표·주목 기업 나열이며 딥다이브 검증 노드는 ✓로 표시된다.<br>온톨로지 · 노드 ${meta.counts?meta.counts.industries:total} 산업 + ${(typeof RAWTHEMES!=='undefined'&&RAWTHEMES?RAWTHEMES.length:0)} 테마 · 엣지 ${meta.counts?meta.counts.edges:'—'}<br><b>${esc(meta.version||'')}</b> · os ${esc(meta.os_version||'v1.3')} · ${esc(meta.as_of||'')}${meta.prev_version?` · prev ${esc(meta.prev_version)}`:''}`;
    if(location.hash){ const el=document.querySelector(location.hash); if(el) el.scrollIntoView(); }
  }

  let RAWTHEMES=[];
  function fail(msg){ document.getElementById('app').innerHTML=`<div style="padding:50px 0;font-family:var(--mono);color:var(--soft);line-height:1.8">`+
    `<div style="color:var(--heat);letter-spacing:.1em;margin-bottom:10px">ATLAS · 데이터 로드 실패</div>${msg}</div>`; }
  fetch('./data/ATLAS_PACK.json').then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(pack=>{
      RAWTHEMES=pack.themes||[];
      const g=ATLAS_DERIVE.deriveGraph(pack);
      const con=ATLAS_DERIVE.deriveConsole(pack,g);
      render(con, pack.monthly_diff||{}, pack.meta||{});
    })
    .catch(e=>fail(`data/ATLAS_PACK.json 을 읽지 못했습니다 (${e.message}).<br><br>· GitHub Pages(https)에서는 정상 작동합니다.<br>· 로컬에서 열 때는 file:// 이 아니라 로컬 서버가 필요합니다.<br>&nbsp;&nbsp;예: 폴더에서 <b style="color:var(--ink)">python3 -m http.server</b> 실행 후 localhost 접속.`));
})();
</script>
</body></html>
